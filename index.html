<head>
<meta charset="utf-8">

<title>Opsboard — business operations platform</title>
<meta name="description" content="Opsboard is a demo multi-tenant business operations platform: customers, pipeline, invoices, team roles and reports, scoped per workspace. All data is generated locally in the browser.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#6B3FA0">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Opsboard">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/app.css">
<link rel="stylesheet" href="./assets/opsboard.css">
<script>
/* Colour scheme and reading direction before first paint, so a dark session
   never flashes white and an Arabic session never flashes left-to-right.
   Reads the same two keys the app writes; no preference means light and
   English. main.js and lib/i18n.js take over from here. */
(function () {
  try {
    var saved = JSON.parse(localStorage.getItem('opsboard.chrome.v1') || '{}');
    var dark = saved.theme === 'dark' || false;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  } catch (e) { /* storage blocked: the light palette is the default anyway */ }
  try {
    var lang = localStorage.getItem('opsboard.lang') === 'ar' ? 'ar' : 'en';
    document.documentElement.setAttribute('lang', lang);
    document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    if (lang === 'ar') document.documentElement.classList.add('ar-root');
  } catch (e) { /* storage blocked: English left-to-right is the default anyway */ }
}());
</script>

</body>
